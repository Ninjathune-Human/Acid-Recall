# The iPad project page (site/, docs/ipad.md) on GitHub Pages. After each successful
# deployment, the tag `deploye` moves to the published commit.
#
# One-time setup in the repository: Settings > Pages > Source: GitHub Actions, and the
# github-pages environment must allow the branch (it allows the default branch only, unless
# feat/ipad is the default branch or is added to its deployment branches).
name: pages

on:
  push:
    branches: [feat/ipad]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Move the deploye tag to the published commit
        run: |
          git tag -f deploye "$GITHUB_SHA"
          git push -f origin refs/tags/deploye
